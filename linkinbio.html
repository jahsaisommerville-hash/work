<title>Jahsai & Faith</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one narrow column of "hang-tag" link buttons, a profile header, and an affiliate note at the foot. */
  :root {
    --bg: #fbeff0;
    --surface: #ffffff;
    --ink: #2a1a22;
    --muted: #7a5f6b;
    --line: #ecd3d9;
    --accent: #c2185b;
    --accent-ink: #ffffff;
    --gold: #f2a93b;
    --gold-ink: #3a2408;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1217; --surface: #2a1c23; --ink: #f8e9ee; --muted: #c4a6b2;
      --line: #43303a; --accent: #ff6fa3; --accent-ink: #2a0a17;
      --gold: #f5b955; --gold-ink: #2b1a04; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1217; --surface: #2a1c23; --ink: #f8e9ee; --muted: #c4a6b2;
    --line: #43303a; --accent: #ff6fa3; --accent-ink: #2a0a17;
    --gold: #f5b955; --gold-ink: #2b1a04; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 40px 32px;
    background-image: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

  /* Profile */
  .profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
  .avatar {
    width: 150px; height: 150px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-display); font-weight: 800; font-size: 40px;
    box-shadow: 0 0 0 4px var(--bg), 0 0 0 6px var(--accent);
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: clamp(28px, 7vw, 36px); line-height: 1.1; margin: 6px 0 0;
    text-wrap: balance; letter-spacing: -0.01em;
  }
  .handle { color: var(--muted); font-weight: 500; margin: 0; }
  .bio { margin: 2px 0 0; max-width: 34ch; text-wrap: balance; }

  .socials { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .socials a {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line);
    transition: transform .15s ease, border-color .15s ease;
  }
  .socials a:hover { transform: translateY(-2px); border-color: var(--accent); }
  .socials svg { width: 20px; height: 20px; }

  /* Hang-tag links */
  .links { display: flex; flex-direction: column; gap: 14px; list-style: none; padding: 0; margin: 0; }
  .tag {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px 16px 44px;
    background: var(--surface); color: var(--ink);
    border: 1.5px solid var(--line);
    border-radius: 10px 18px 18px 10px;
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  /* the punched hole of a price tag */
  .tag::before {
    content: ""; position: absolute; left: 16px; top: 50%;
    width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--line);
  }
  .tag:hover { transform: translateX(4px) rotate(-0.4deg); border-color: var(--accent); box-shadow: 0 6px 18px -10px var(--accent); }
  .tag:focus-visible, .socials a:focus-visible, .share:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .tag .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); color: var(--accent); }
  .tag .ico svg { width: 22px; height: 22px; }
  .tag .txt { min-width: 0; display: flex; flex-direction: column; }
  .tag .label { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.2; }
  .tag .sub { color: var(--muted); font-size: 14px; }
  .tag .arrow { margin-left: auto; flex: none; color: var(--muted); font-size: 20px; }

  .tag.featured {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    padding-block: 22px;
  }
  .tag.featured::before { border-color: var(--accent-ink); opacity: .9; }
  .tag.featured .ico { background: var(--accent-ink); color: var(--accent); }
  .tag.featured .sub, .tag.featured .arrow { color: var(--accent-ink); opacity: .85; }
  .tag.featured .label { font-size: 20px; }
  .stamp {
    position: absolute; top: -10px; right: 14px;
    background: var(--gold); color: var(--gold-ink);
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 999px; transform: rotate(3deg);
  }

  /* Footer */
  footer { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .share {
    font: 600 14px var(--font-body); color: var(--ink);
    background: transparent; border: 1.5px solid var(--ink); border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
  }
  .share:hover { background: var(--ink); color: var(--bg); }
  .disclosure { color: var(--muted); font-size: 12.5px; max-width: 40ch; margin: 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main class="wrap">
  <header class="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="handle" id="handle"></p>
    <p class="bio" id="bio"></p>
    <nav class="socials" id="socials" aria-label="Social profiles"></nav>
  </header>

  <ul class="links" id="links"></ul>

  <footer>
    <button class="share" id="share" type="button">Copy my link</button>
    <p class="disclosure" id="disclosure"></p>
  </footer>
</main>

<script>
/* ================================================================
   EDIT YOUR INFO HERE
   Replace the placeholder names and URLs with your own.
   ================================================================ */
const PROFILE = {
  name: "Jahsai & Faith",
  handle: "",         // optional, e.g. "@yourhandle"
  bio: "Everyday finds, home faves and the products I actually use. Tap a tag to shop.",
  photo: "profile.jpg", // leave empty to show your initials instead
};

const LINKS = [
  { label: "Shop My Amazon Picks", sub: "Tap to shop on Amazon", url: "https://a.co/d/0agUD5aT", icon: "bag", featured: true, stamp: "Shop" },
  // Links with an empty url are hidden until you fill them in.
  { label: "Jahsai on Instagram", sub: "@jahsai", url: "https://www.instagram.com/jahsai/", icon: "instagram" },
  { label: "Jahsai on TikTok", sub: "@jahsai", url: "https://www.tiktok.com/@jahsai", icon: "tiktok" },
  { label: "Faith on Instagram", sub: "@cyb3rgrlfrnd", url: "https://www.instagram.com/cyb3rgrlfrnd/", icon: "instagram" },
  { label: "Faith on TikTok", sub: "@digitalxPrincess", url: "https://www.tiktok.com/@digitalxPrincess", icon: "tiktok" },
];

const DISCLOSURE = "As an Amazon Influencer, I earn from qualifying purchases. Some links may be affiliate links.";
/* ================================================================ */

const ICONS = {
  bag: '<path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  tiktok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.2 4.4 5 4.6"/>',
  instagram: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/>',
  youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.2v5.6l4.8-2.8L10 9.2Z" fill="currentColor"/>',
  mail: '<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k] || ICONS.bag}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

document.getElementById("name").textContent = PROFILE.name;
document.getElementById("handle").textContent = PROFILE.handle;
document.getElementById("handle").hidden = !PROFILE.handle;
document.getElementById("bio").textContent = PROFILE.bio;
document.getElementById("disclosure").textContent = DISCLOSURE;

const av = document.getElementById("avatar");
if (PROFILE.photo) av.innerHTML = `<img src="${esc(PROFILE.photo)}" alt="${esc(PROFILE.name)}">`;
else av.textContent = PROFILE.name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();

document.getElementById("links").innerHTML = LINKS.filter((l) => l.url).map((l) => `
  <li><a class="tag${l.featured ? " featured" : ""}" href="${esc(l.url)}" target="_blank" rel="noopener">
    ${l.stamp ? `<span class="stamp">${esc(l.stamp)}</span>` : ""}
    <span class="ico">${svg(l.icon)}</span>
    <span class="txt"><span class="label">${esc(l.label)}</span><span class="sub">${esc(l.sub)}</span></span>
    <span class="arrow" aria-hidden="true">&rarr;</span>
  </a></li>`).join("");

document.getElementById("socials").hidden = true;

const shareBtn = document.getElementById("share");
shareBtn.addEventListener("click", () => {
  const url = location.href.split("#")[0];
  const done = () => { shareBtn.textContent = "Link copied"; setTimeout(() => (shareBtn.textContent = "Copy my link"), 1800); };
  try {
    navigator.clipboard.writeText(url).then(done, () => { shareBtn.textContent = url; });
  } catch (e) { shareBtn.textContent = url; }
});
</script>
